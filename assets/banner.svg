<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.5" stop-color="#58c4ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; } .d3 { animation-delay: 0.7s; } .d4 { animation-delay: 1s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .orb { animation: drift 10s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-120px, 30px); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle class="orb" cx="720" cy="90" r="190" fill="url(#glow)"/>

    <!-- terminal-style label -->
    <g class="fade d1">
      <rect x="56" y="52" width="176" height="28" rx="14" fill="#2f81f7" fill-opacity="0.15" stroke="#2f81f7" stroke-opacity="0.5"/>
      <circle cx="74" cy="66" r="4" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="86" y="71" font-size="13" fill="#9cc6ff" font-family="Consolas, 'Fira Code', monospace">open to opportunities</text>
    </g>

    <text class="fade d2" x="56" y="138" font-size="52" font-weight="700" fill="#f0f6fc">Connor Davies</text>
    <rect class="fade d3" x="58" y="156" width="210" height="4" rx="2" fill="url(#accent)"/>

    <g class="fade d4" font-family="Consolas, 'Fira Code', monospace" font-size="17" fill="#8b949e">
      <text x="56" y="200"><tspan fill="#58c4ff">&gt;</tspan> Computing student · Python &amp; web development<tspan class="cursor" fill="#58c4ff"> ▍</tspan></text>
    </g>

    <!-- code card on the right -->
    <g class="fade d3" transform="translate(600 58)">
      <rect width="250" height="150" rx="12" fill="#0d1117" stroke="#30363d"/>
      <circle cx="18" cy="18" r="5" fill="#ff5f57"/><circle cx="34" cy="18" r="5" fill="#febc2e"/><circle cx="50" cy="18" r="5" fill="#28c840"/>
      <g font-family="Consolas, 'Fira Code', monospace" font-size="13">
        <text x="18" y="56"><tspan fill="#ff7b72">class</tspan><tspan fill="#d2a8ff"> Connor</tspan><tspan fill="#c9d1d9">:</tspan></text>
        <text x="34" y="80"><tspan fill="#c9d1d9">role = </tspan><tspan fill="#a5d6ff">"student"</tspan></text>
        <text x="34" y="102"><tspan fill="#c9d1d9">stack = [</tspan><tspan fill="#a5d6ff">"py"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"web"</tspan><tspan fill="#c9d1d9">]</tspan></text>
        <text x="34" y="124"><tspan fill="#c9d1d9">learning = </tspan><tspan fill="#79c0ff">True</tspan></text>
      </g>
    </g>
  </g>
</svg>
