<svg xmlns="http://www.w3.org/2000/svg" width="420" height="130" viewBox="0 0 420 130" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <style>.card{animation:in .7s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
  <g class="card">
    <rect x="1" y="1" width="418" height="128" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="4" height="128" rx="2" fill="url(#edge)"/>
    <text x="26" y="44" font-size="20">🔒</text>
    <text x="58" y="43" font-size="19" font-weight="700" fill="#f0f6fc">Password Strength Checker</text>
    <text x="26" y="76" font-size="14" fill="#8b949e">Rates password strength. Nothing is stored or logged.</text>
    <circle cx="32" cy="104" r="6" fill="#3572A5"/>
    <text x="44" y="109" font-size="13" fill="#8b949e">Python</text>
    <text x="394" y="109" font-size="13" fill="#58a6ff" text-anchor="end">View repo →</text>
  </g>
</svg>